name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CW_SKIP_ADOPTION_MATRIX: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install and set up project
        run: npm run setup --if-present

      - name: Verify project
        run: npm run check

      - name: Verify architecture
        run: npm run check-arch
