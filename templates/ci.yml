name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CW_SKIP_ADOPTION_MATRIX: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Install and set up project
        run: npm run setup --if-present

      # A feature that became passing on this branch must have evidence for the commit being
      # merged: only harness bookkeeping may change after it (feat-055). Needs full history.
      - name: Evidence matches the merged code
        if: github.event_name == 'pull_request'
        run: npm run evidence-check -- --base origin/${{ github.base_ref }}

      - name: Verify project
        run: npm run check

      - name: Verify architecture
        run: npm run check-arch
