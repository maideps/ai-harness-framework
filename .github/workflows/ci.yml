name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Real toolchains so the adoption matrix's python/go/rust cells run
      # instead of degrading to SKIP.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - uses: dtolnay/rust-toolchain@stable

      - name: Install python check tools
        run: pip install ruff pytest

      - name: Full harness check (includes the adoption matrix)
        run: npm run check

      - name: Architecture rules
        run: npm run check-arch

      # The Makefile surface delegates to the same runner; prove it on Linux
      # where make is available (the primary dev machine lacks make).
      - name: Makefile surface
        if: matrix.node == '18'
        run: make check

  # Adopters develop on Windows too: the runner's unit tests and architecture rules run there,
  # so path-separator and line-ending bugs fail CI instead of every Windows adopter's check
  # (feat-018). The full check stays on Linux: its adoption matrix needs bash, make and the
  # other toolchains.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Runner unit tests
        run: npm run test

      - name: Architecture rules
        run: npm run check-arch
